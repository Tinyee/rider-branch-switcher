settings.scope.description=以下设置对当前项目中的所有预设生效。
settings.dirty.stash.description=切换前暂存未提交改动，操作结束后自动恢复。恢复后的条目仍保留在 Git stash 中作为人工恢复备份，确认不再需要后请通过 Git 检查并清理；暂存失败时跳过该仓库。
settings.dirty.skip.description=保留有未提交改动的仓库不动，并继续切换其他仓库。
settings.dirty.force.description=不暂存改动，直接执行普通 checkout。Git 遇到冲突时会拒绝切换，不会自动丢弃本地文件。
settings.timeout.description=每次 status、fetch、checkout、pull 或子模块命令允许运行的最长时间。
settings.fetch.description=checkout 前对每个可用仓库执行 git fetch --prune；失败会报告，并尽可能继续处理其他仓库。
settings.pull.description=checkout 成功后执行 git pull --ff-only；分支发生分叉时不会自动 merge 或 rebase。
settings.confirm.init.description=发现本地缺失的子模块时，执行 git submodule update --init --recursive 前逐个确认。

