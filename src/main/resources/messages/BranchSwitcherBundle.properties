settings.scope.description=These settings apply to every preset in the current project.
settings.dirty.stash.description=Stash uncommitted changes before checkout and restore them when switching finishes. Restored entries remain in Git stash as manual recovery backups; review and remove them with Git when no longer needed. If stashing fails, that repository is skipped.
settings.dirty.skip.description=Leave repositories with uncommitted changes untouched and continue switching the remaining repositories.
settings.dirty.force.description=Run a normal checkout without stashing first. Git may reject conflicting changes; local files are not discarded automatically.
settings.timeout.description=Maximum time allowed for each Git command, including inspection, fetch, checkout, pull, and submodule operations.
settings.fetch.description=Run git fetch --prune for each available repository before checkout. Failures are reported, and switching continues where possible.
settings.pull.description=Run git pull --ff-only after a successful checkout. Diverged branches are not merged or rebased automatically.
settings.confirm.init.description=Confirm each missing submodule before running git submodule update --init --recursive for it.
settings.discard.meta.auto.description=When a switch would overwrite untracked .meta files, discard them automatically instead of asking. The target branch provides the tracked replacement for each discarded .meta file.

