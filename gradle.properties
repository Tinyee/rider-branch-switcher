kotlin.stdlib.default.dependency=false
# 2.11 is the final IntelliJ Platform Gradle Plugin line supporting Gradle 8.13.
# Newer plugin releases require a separate Gradle 9 migration.
org.jetbrains.intellij.platform.selfUpdateCheck=false
# Searchable options are intentionally disabled in build.gradle.kts.
org.jetbrains.intellij.platform.noSearchableOptionsWarning=false
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.parallel=true

systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.http.socketTimeout=600000

# Add regional dependency mirrors only when explicitly requested with
# -PuseChinaMirrors=true. Official repositories remain the default.

# ---- Cross-JetBrains platform configuration ----
# IntelliJ IDEA uses the unified IU distribution from 2025.3 onward.
# Other product codes can be used for local validation, for example:
# IU = IntelliJ IDEA (unified), IC = legacy Community releases, RD = Rider,
# PY = PyCharm Professional, WS = WebStorm, CL = CLion.
platform.type=IU
platform.version=2026.1.3

# Optional local IDE path. When set, Gradle uses that installation instead of
# downloading the platform SDK above.
# macOS:  /Applications/IntelliJ IDEA.app
# Win:    C:/Program Files/JetBrains/IntelliJ IDEA 2026.1
# Linux:  ~/.local/share/JetBrains/Toolbox/apps/intellij-idea/...
platform.localPath=

# Plugin compatible IDE build range.
plugin.sinceBuild=261
plugin.untilBuild=261.*

# Product codes used by verifyPlugin. Keep this short for local development;
# add more IDEs before Marketplace release if needed.
plugin.verifier.ideCodes=RD

# JetBrains Marketplace token (https://plugins.jetbrains.com/authorize).
# Can also be provided with the PUBLISH_TOKEN environment variable.
publishToken=
