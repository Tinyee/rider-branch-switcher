name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3  # v4
        with:
          java-version: 21
          distribution: temurin

      - name: Ensure gradlew is executable (non-Windows)
        if: runner.os != 'Windows'
        run: chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb  # v6.3.0

      - name: Run tests
        run: ./gradlew :core:test :test --no-parallel --max-workers=2

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: test-results-${{ matrix.os }}
          path: |
            build/reports/tests/
            core/build/reports/tests/

  quality:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3  # v4
        with:
          java-version: 21
          distribution: temurin

      - name: Ensure gradlew is executable
        run: chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb  # v6.3.0

      - name: Run quality checks and build plugin
        run: ./gradlew :core:detekt :detekt :quickCheck :checkQuickCheck :validateReleaseMetadata --no-parallel --max-workers=2

      - name: Upload plugin artifact
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: plugin
          path: build/distributions/*.zip

  compatibility:
    needs: quality
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        ide:
          - RD:2025.1.9
          - RD:2025.2.6.1
          - RD:2025.3.5
          - RD:2026.1.4
          - RD:2026.2.0.1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3  # v4
        with:
          java-version: 21
          distribution: temurin

      - name: Ensure gradlew is executable
        run: chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb  # v6.3.0

      - name: Verify plugin against ${{ matrix.ide }}
        run: ./gradlew verifyPlugin -Pplugin.verifier.ideTargets=${{ matrix.ide }} --no-parallel --max-workers=2
